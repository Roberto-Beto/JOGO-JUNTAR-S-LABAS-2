<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jogo: Juntar Sílabas</title>
  <style>
    body{font-family:Arial, sans-serif;background:#f0f4f9;margin:0;padding:0;}
    .app{max-width:960px;margin:20px auto;padding:20px;background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.1)}
    h1{margin-top:0;}
    .target{min-height:80px;display:flex;gap:8px;padding:10px;border:2px dashed #ccc;border-radius:8px;margin-bottom:10px;flex-wrap:wrap;}
    .slot{min-width:60px;padding:8px;border:1px dashed #aaa;border-radius:8px;text-align:center;}
    .pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;}
    .syll{padding:10px 14px;border-radius:10px;background:#e9eefc;border:1px solid #cbd5e1;cursor:grab;}
    button{padding:8px 12px;margin:5px;border-radius:8px;cursor:pointer;border:none;background:#2563eb;color:white;}
    button.ghost{background:#f1f5f9;color:#2563eb;border:1px solid #2563eb;}
    .message{margin-top:10px;padding:10px;border-radius:8px;}
    .good{background:#bbf7d0;color:#166534;}
    .bad{background:#fecaca;color:#7f1d1d;}
  </style>
</head>
<body>
  <div class="app">
    <h1>Jogo: Juntar Sílabas</h1>
    <p>Arraste as sílabas para formar a palavra correta!</p>

    <div id="target" class="target"></div>
    <div id="pool" class="pool"></div>
    <button id="checkBtn">Verificar</button>
    <button class="ghost" id="nextBtn">Próxima</button>
    <div id="feedback"></div>
  </div>

  <script>
    const words = [
      "CASA","MESA","BOLA","SAPATO","LAPIS","VARA","ABACAXI","COMPUTADOR","ELEFANTE","CARRO","ESCOLA"
    ];
    let index = 0;
    let score = 0;

    const poolEl = document.getElementById('pool');
    const targetEl = document.getElementById('target');
    const feedbackEl = document.getElementById('feedback');

    function splitSyllables(word){
      const vowels = "AEIOUÁÉÍÓÚÃÕÂÊÔ";
      let res=[],cur="";
      for(let i=0;i<word.length;i++){
        cur+=word[i];
        const isV=vowels.includes(word[i]);
        const next=word[i+1]||"";
        const nextIsV=vowels.includes(next);
        if(isV && (!next || !nextIsV)){res.push(cur);cur="";}
      }
      if(cur)res.push(cur);
      if(res.length==0){let mid=Math.ceil(word.length/2);res=[word.slice(0,mid),word.slice(mid)];}
      return res;
    }

    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

    function render(){
      const word=words[index];const sylls=splitSyllables(word);
      targetEl.innerHTML="";poolEl.innerHTML="";feedbackEl.innerHTML="";
      sylls.forEach((s,i)=>{
        const slot=document.createElement("div");
        slot.className="slot";slot.dataset.expected=s;slot.dataset.occupied="";
        slot.addEventListener("dragover",ev=>ev.preventDefault());
        slot.addEventListener("drop",onDropToSlot);
        targetEl.appendChild(slot);
      });
      shuffle([...sylls]).forEach(s=>{
        const el=document.createElement("div");
        el.className="syll";el.textContent=s;el.draggable=true;
        el.id="syll-"+Math.random().toString(36).slice(2,9);
        el.dataset.syll=s;
        el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",el.id));
        poolEl.appendChild(el);
      });
    }

    function onDropToSlot(ev){
      ev.preventDefault();
      const id=ev.dataTransfer.getData("text/plain");
      const dragged=document.getElementById(id);
      const slot=ev.currentTarget;
      if(!dragged)return;
      if(slot.dataset.occupied){let prev=document.getElementById(slot.dataset.occupied);if(prev)poolEl.appendChild(prev);}
      slot.dataset.occupied=dragged.id;
      slot.textContent=dragged.dataset.syll;
      dragged.remove();
    }

    function readAssembled(){return [...targetEl.querySelectorAll(".slot")].map(s=>s.textContent.trim()).filter(Boolean);}

    function check(){
      const word=words[index];const expected=word.toUpperCase().replace(/[^A-ZÀ-Ú]/g,"");
      const formed=readAssembled().join("").toUpperCase().replace(/[^A-ZÀ-Ú]/g,"");
      if(formed===expected){feedbackEl.innerHTML='<div class="message good">Correto! '+word+'</div>';score++;}
      else{feedbackEl.innerHTML='<div class="message bad">Incorreto. Você formou '+formed+' (esperado '+word+')</div>';}
    }

    function next(){index=(index+1)%words.length;render();}

    document.getElementById("checkBtn").addEventListener("click",check);
    document.getElementById("nextBtn").addEventListener("click",next);

    render();
  </script>
</body>
</html>
